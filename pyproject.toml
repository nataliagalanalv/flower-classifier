[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flower-classifier"
version = "0.1.0"
description = "Flower image classifier (Oxford 102 Flowers) using PyTorch: CNN from scratch vs. transfer learning with ResNet18."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flower-classifier"
version = "0.1.0"
description = "Flower image classifier (Oxford 102 Flowers) using PyTorch: CNN from scratch vs. transfer learning with ResNet18."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "pillow>=12.3",
    "numpy>=2.5",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=0.28.1"
]
api = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
   flower_classifier = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
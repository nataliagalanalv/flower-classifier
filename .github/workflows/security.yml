name: security

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository
permissions:
  contents: read

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image
        run: docker build -t flower-classifier:${{ github.sha }} .

      - name: Scan the image with Trivy
        # Pinned by full commit SHA (tag v0.36.0), not by tag
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flower-classifier:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.76.1
          exit-code: '1'   # block the PR when there are fixable HIGH/CRITICAL vulnerabilities
  
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan Dockerfile and workflows with Checkov
        run: |
          docker run --rm --volume "$PWD:/src:ro" --workdir /src \
            bridgecrew/checkov@sha256:ece5efac4443084ca273072909985dce988a81e8cc94faa305aeda0df27c68f9 \
            --file /src/Dockerfile --directory /src/.github/workflows